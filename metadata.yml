name: "Mathematik von Grund auf"
description: "Eine Einführung in die Mathematik in achtundzwanzig Bänden (5324 Seiten), von der Schulmathematik bis zur Ökonometrie. Jeder Schritt erklärt, alle Übungsaufgaben vollständig gelöst, jedes Kapitel mit Geschichte, Forschungsstand und einem Abschnitt darüber, wo die Methode bricht. Achtundzwanzig kommentierte Quellen je Band. Leitfälle überwiegend aus der Medizin. Frei unter CC BY-SA 4.0."
